# Infraestrutura local do Navizin.
# Compatível com Podman (podman-compose) e Docker Compose.
# Valores de desenvolvimento: copie .env.example para .env antes de subir.

services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: navizin-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-navizin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-navizin_dev}
      POSTGRES_DB: ${POSTGRES_DB:-navizin}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-navizin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: navizin-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: docker.io/minio/minio:latest
    container_name: navizin-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-navizin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-navizin_dev_secret}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio_data:/data

  jaeger:
    image: docker.io/jaegertracing/all-in-one:latest
    container_name: navizin-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP

  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: navizin-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

volumes:
  postgres_data:
  redis_data:
  minio_data:
