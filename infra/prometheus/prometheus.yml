# Configuração do Prometheus para o Navizin.
# Coleta as métricas do próprio Prometheus e, quando existir, da API FastAPI.

global:
  scrape_interval: 15s      # frequência de coleta
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # A API roda fora do container nesta fase de desenvolvimento.
  # Quando expuser /metrics, ajuste o alvo para o host da API.
  - job_name: navizin-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.containers.internal:8000"]
